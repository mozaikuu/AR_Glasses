services:
   - type: web
     name: nmu-smart-bus-backend
     runtime: python
     rootDir: backend
     buildCommand: pip install -r requirements.txt
     startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
     envVars:
        - key: DATABASE_URL
          value: sqlite:///./backend/data/bus_tracking.db
