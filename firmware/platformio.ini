[platformio]
default_envs = native
src_dir = .

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  -<*>
  +<src/text_protocol.cpp>
build_flags =
  -std=gnu++17

[env:esp32-wrover-base]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
build_src_filter =
  -<*>
  +<esp32_wrover_entry.cpp>
lib_deps =
  olikraus/U8g2@^2.36.5
board_build.partitions = min_spiffs.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

[env:esp32-wrover-full]
extends = env:esp32-wrover-base
build_flags =
  ${env:esp32-wrover-base.build_flags}
  -DPROFILE_FULL

[env:esp32-wrover-wifi-only]
extends = env:esp32-wrover-base
build_flags =
  ${env:esp32-wrover-base.build_flags}
  -DPROFILE_WIFI_ONLY

[env:esp32-wrover-audio-test]
extends = env:esp32-wrover-base
build_flags =
  ${env:esp32-wrover-base.build_flags}
  -DPROFILE_AUDIO_TEST

[env:esp32-wrover-minimal]
extends = env:esp32-wrover-base
build_flags =
  ${env:esp32-wrover-base.build_flags}
  -DPROFILE_MINIMAL

[env:esp32-wrover-camera-test]
extends = env:esp32-wrover-base
build_flags =
  ${env:esp32-wrover-base.build_flags}
  -DPROFILE_CAMERA_TEST

[env:esp32-wrover-camera-only-tmp]
extends = env:esp32-wrover-base
build_src_filter =
  -<*>
  +<esp32_camera_only_entry.cpp>
build_flags =
  ${env:esp32-wrover-base.build_flags}
