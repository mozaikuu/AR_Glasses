[project]
name = "smart-glasses-distilled"
version = "0.1.0"
description = "Distilled runtime for Smart Glasses backend and interfaces"
readme = "docs/01_overview/system_overview.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "flask>=3.0.0",
    "httpx>=0.28.0",
    "aiohttp>=3.10.0",
    "streamlit>=1.45.0",
    "streamlit-webrtc>=0.62.4",
    "SpeechRecognition>=3.10.4",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "transformers>=5.3.0",
    "torch>=2.10.0",
]

[tool.uv]
package = false
