[project]
name = "smart-glasses"
version = "0.1.0"
description = "your ai companion and navigation in Smart Glasses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
 # MCP & Server
 "fastmcp==2.14.1",
 "mcp==1.24.0",
 "fastapi",
 "uvicorn",
 "aiohttp",

 # Web UI
 "flask",
 "streamlit",
 "streamlit-webrtc",

 # ML/AI
 "torch",
 "transformers",
 "ultralytics",
 "whisper",
 "mediapipe",
 "scikit-learn",
 "bitsandbytes",  # For Moondream quantization

 # Computer Vision
 "numpy",
 "opencv-python",
 "pillow",
 "Pillow",

 # Audio
 "edge-tts",
 "mutagen",
 "pygame",
 "pyaudio",
 "speechrecognition",

 # Navigation & Graphs
 "networkx",
 "matplotlib",

 # Web & Data
    "requests",
    "duckduckgo-search",
    "beautifulsoup4",
 "python-dotenv",

 # Utilities
 "pydantic",
 "python-dateutil",
]
[[project.authors]]
name = "Ahmed Moussa"
email = "ahmedmoussa.dev@gmail.com"

[build-system]
requires = [ "uv_build>=0.9.14,<0.10.0",]
build-backend = "uv_build"

[project.scripts]
mcp-server = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.uv]
package = false
