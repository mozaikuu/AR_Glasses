<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Smart Glasses AR Renderer</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
					sans-serif;
				background: #1a1a2e;
				color: #eee;
				overflow: hidden;
			}

			#container {
				position: relative;
				width: 100vw;
				height: 100vh;
			}

			#camera-feed {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				z-index: 1;
			}

			#ar-canvas {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 2;
				pointer-events: none;
			}

			#controls {
				position: fixed;
				top: 20px;
				left: 20px;
				z-index: 10;
				background: rgba(0, 0, 0, 0.7);
				padding: 15px;
				border-radius: 8px;
				min-width: 200px;
			}

			#controls h3 {
				margin-bottom: 10px;
				font-size: 14px;
				color: #00d4ff;
			}

			.control-row {
				margin-bottom: 8px;
				font-size: 12px;
			}

			.control-row label {
				display: block;
				margin-bottom: 4px;
				color: #aaa;
			}

			.status {
				display: inline-block;
				width: 8px;
				height: 8px;
				border-radius: 50%;
				margin-right: 8px;
			}

			.status.connected {
				background: #00ff00;
			}

			.status.disconnected {
				background: #ff0000;
			}

			#stats {
				position: fixed;
				bottom: 20px;
				left: 20px;
				z-index: 10;
				background: rgba(0, 0, 0, 0.7);
				padding: 10px 15px;
				border-radius: 8px;
				font-size: 12px;
				font-family: monospace;
			}

			.stat-row {
				display: flex;
				justify-content: space-between;
				margin-bottom: 4px;
			}

			.stat-value {
				color: #00d4ff;
				margin-left: 20px;
			}
		</style>
	</head>
	<body>
		<div id="container">
			<video id="camera-feed" autoplay playsinline></video>
			<canvas id="ar-canvas"></canvas>
		</div>

		<div id="controls">
			<h3>AR Pipeline Status</h3>
			<div class="control-row">
				<span id="connection-status" class="status disconnected"></span>
				<<span id="status-text">Disconnected</span>
			</div>
			<div class="control-row">
				<label>Server URL</label>
				<input
					type="text"
					id="server-url"
					value="ws://localhost:8765"
					style="width: 100%; padding: 5px"
				/>
			</div>
			<div class="control-row">
				<button
					id="connect-btn"
					style="width: 100%; padding: 8px; cursor: pointer"
				>
					Connect
				</button>
			</div>
			<div class="control-row">
				<label>Debug Overlay</label>
				<input type="checkbox" id="debug-overlay" />
			</div>
		</div>

		<div id="stats">
			<div class="stat-row">
				<span>FPS:</span>
				<span id="fps" class="stat-value">0</span>
			</div>
			<div class="stat-row">
				<span>Latency:</span>
				<span id="latency" class="stat-value">0ms</span>
			</div>
			<div class="stat-row">
				<span>Markers:</span>
				<span id="markers" class="stat-value">0</span>
			</div>
		</div>

		<script src="three.min.js"></script>
		<script src="app.js"></script>
	</body>
</html>
