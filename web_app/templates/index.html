<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Smart Glasses AI Assistant</title>
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='css/style.css') }}"
		/>
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div class="container">
			<header>
				<h1><i class="fas fa-glasses"></i> Smart Glasses AI Assistant</h1>
				<p>Hands-free AI companion powered by voice commands</p>
			</header>

			<main>
				<div class="status-card" id="statusCard">
					<div class="status-indicator" id="statusIndicator"></div>
					<div class="status-text">
						<h3 id="statusTitle">Status: Initializing...</h3>
						<p id="statusMessage">Connecting to system...</p>
					</div>
				</div>

				<div class="controls">
					<button
						id="btnStart"
						class="btn btn-primary"
						onclick="startListening()"
					>
						<i class="fas fa-play"></i> Start Listening
					</button>
					<button
						id="btnStop"
						class="btn btn-danger hidden"
						onclick="stopListening()"
					>
						<i class="fas fa-stop"></i> Stop Listening
					</button>
					<button
						id="btnRecord"
						class="btn btn-secondary"
						onclick="manualRecord()"
					>
						<i class="fas fa-microphone"></i> Manual Record (5s)
					</button>
				</div>

				<div class="chat-container" id="chatContainer">
					<!-- Messages will be added here dynamically -->
					<div class="welcome-message">
						<p>
							👋 Welcome! Say <strong>"Computer"</strong> to activate.
						</p>
					</div>
				</div>

				<div class="input-area">
					<input
						type="text"
						id="textInput"
						placeholder="Type a message..."
						onkeypress="handleKeyPress(event)"
					/>
					<button onclick="sendText()">
						<i class="fas fa-paper-plane"></i>
					</button>
				</div>
			</main>
		</div>

		<script src="{{ url_for('static', filename='js/main.js') }}"></script>
	</body>
</html>
