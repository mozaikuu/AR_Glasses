# Smart Glasses Mobile Gateway

A cross-platform mobile app (iOS/Android) that acts as a gateway between ESP32 smart glasses and the server.

## Features

- BLE connection to ESP32 smart glasses
- Camera/audio streaming to server
- Real-time navigation instructions
- Voice interaction support
- Context-aware notifications

## Getting Started

### Prerequisites

- Flutter 3.0+
- Dart 3.0+
- Android Studio / Xcode

### Installation

```bash
# Clone the repository
git clone https://github.com/yourusername/smart-glasses.git

# Navigate to mobile directory
cd smart-glasses/mobile

# Get dependencies
flutter pub get

# Run on device
flutter run
```

### Configuration

Edit `lib/config.dart` to set your server address:

```dart
class Config {
  static const String serverUrl = 'http://YOUR_SERVER_IP:8001';
  static const String bleServiceUuid = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
  static const String bleCharacteristicUuid = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
}
```

## Architecture

```
┌─────────────────┐     ┌─────────────┐     ┌─────────────────┐
│   Smart Glasses │────▶│    Phone    │────▶│    Server(s)    │
│  (ESP32-S3)     │ BLE │  (Flutter)  │ HTTPS │  (Python/AI)   │
└─────────────────┘     └─────────────┘     └─────────────────┘
                              │
                              ▼
                       ┌─────────────┐
                       │  Local DB   │
                       │  (Hive)     │
                       └─────────────┘
```

