## Dependencies

- `flutter_blue_plus`: BLE functionality
- `http`: REST API client
- `provider`: State management
- `hive`: Local storage
- `flutter_tts`: Text-to-speech
- `speech_to_text`: Voice recognition
- `geolocator`: Location services

## API Endpoints

| Endpoint | Method | Description |
|----------|--------|-------------|
| `/v2/voice/process` | POST | Process voice command |
| `/v2/vision/detect` | POST | Detect objects in image |
| `/v2/gesture/recognize` | POST | Process gesture |
| `/v2/navigation/start` | POST | Start navigation |
| `/v2/context/update` | POST | Update context |
| `/v2/context/suggest` | GET | Get suggestions |

