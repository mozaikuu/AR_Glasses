## Usage

1. **Pairing**: Tap "Scan" to find nearby smart glasses
2. **Connection**: Tap the device to connect
3. **Commands**: Use voice or gestures to control
4. **Navigation**: Select destination from the menu

## API Endpoints

The mobile gateway communicates with:

- `POST /v2/voice/process` - Voice command processing
- `GET /v2/navigation/locations` - Available destinations
- `POST /v2/context/update` - Update context
- `GET /v2/context/suggest` - Get proactive suggestions

