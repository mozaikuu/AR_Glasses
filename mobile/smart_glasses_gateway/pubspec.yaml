# Smart Glasses Mobile Gateway

A Flutter mobile app that serves as a gateway between ESP32 smart glasses and the server.

## Features

- BLE connection to ESP32 smart glasses
- Camera/microphone streaming
- Voice command processing
- Navigation guidance display
- Context-aware notifications

## Getting Started

### Prerequisites

- Flutter 3.0+ (https://flutter.dev/docs/get-started/install)
- Android SDK / Xcode (for mobile development)
- A physical device (BLE requires real hardware)

### Installation

```bash
# Clone the repository
git clone <repo_url>

# Navigate to mobile directory
cd mobile/smart_glasses_gateway

# Get dependencies
flutter pub get

# Run on device
flutter run -d <device_id>
```

### Configuration

Edit `lib/config.dart` to set your server URL:

```dart
class Config {
  static const String serverUrl = 'http://YOUR_SERVER_IP:8001';
  static const String bleServiceUuid = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
  static const String bleCharacteristicUuid = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
}
```

